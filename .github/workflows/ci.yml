name: Grasshopper CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/grasshopper ./cmd/grasshopper-go-server ./cmd/grasshopper-go-backup ./cmd/grasshopper-go-migrate ./cmd/grasshopper-go-bundle
      - name: Race checks
        if: runner.os != 'Windows'
        run: go test -race ./internal/gomemory ./internal/gomcp ./internal/goclient
