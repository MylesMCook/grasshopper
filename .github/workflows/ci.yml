name: Grasshopper CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/grasshopper ./cmd/grasshopper-go-server ./cmd/grasshopper-go-backup ./cmd/grasshopper-go-migrate ./cmd/grasshopper-go-bundle
      - name: Race checks
        if: runner.os != 'Windows'
        run: go test -race ./internal/gomemory ./internal/gomcp ./internal/goclient
      - name: Build native release binaries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          case "$RUNNER_OS" in Windows) suffix=.exe ;; *) suffix= ;; esac
          mkdir -p release-bin
          for app in grasshopper grasshopper-go-server grasshopper-go-backup grasshopper-go-migrate; do
            flags=
            case "$app" in
              grasshopper) flags="-X main.clientVersion=$(cat VERSION)" ;;
              grasshopper-go-server) flags="-X main.serverVersion=$(cat VERSION)" ;;
            esac
            go build -trimpath -buildvcs=false -ldflags="$flags" -o "release-bin/$app$suffix" "./cmd/$app"
          done
          test "$(./release-bin/grasshopper$suffix --version)" = "grasshopper $(cat VERSION)"
          test "$(./release-bin/grasshopper-go-server$suffix --version)" = "grasshopper server $(cat VERSION)"
      - name: Upload native release binaries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: grasshopper-native-${{ runner.os }}
          path: release-bin/
          if-no-files-found: error
