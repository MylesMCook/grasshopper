name: Grasshopper CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Restore pinned embedding test assets
        run: node scripts/fetch-embedding-test-assets.mjs
      - run: go test ./...
      - run: go vet ./...
      - run: node --test internal/service/visualizer/app.test.cjs web/connect.test.cjs web/setup.test.cjs
      - run: go build ./cmd/grasshopper ./cmd/grasshopper-server ./cmd/grasshopper-backup ./cmd/grasshopper-migrate ./cmd/grasshopper-bundle
      - name: Race checks
        if: runner.os != 'Windows'
        run: go test -race ./internal/memory ./internal/service ./internal/client
