name: Bug report
description: Something in Grasshopper does not work as expected.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Grasshopper version
      description: Run `grasshopper --version` or check Settings in the memory view.
      placeholder: "2.8.5"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options: [Codex, Claude Code, Cursor, Memory view only, Server only]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Leave out tokens, memory text you consider private, and server addresses.
    validations:
      required: true
