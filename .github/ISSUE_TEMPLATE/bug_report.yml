name: Bug report
description: Something in Grasshopper does not work as expected.
labels: [bug]
body:
  - type: input
    id: client-version
    attributes:
      label: Client version
      description: Run `grasshopper --version` on the machine with the problem. Write "Unknown" or "N/A" if it does not apply.
      placeholder: "2.9.0"
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Server version
      description: Shown in the memory view, or run `grasshopper-server --version`. Write "Unknown" or "N/A" if it does not apply.
      placeholder: "2.9.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options: [Codex, Claude Code, Cursor, Memory view only, Server only]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Leave out tokens, memory text you consider private, and server addresses.
    validations:
      required: true
