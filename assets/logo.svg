<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Subtle glow for depth, but the logo reads flat without it -->
    <radialGradient id="bodyGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#388E3C"/>
    </radialGradient>
    <radialGradient id="headGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#81C784"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </radialGradient>
  </defs>

  <!-- ── Hind legs (thigh + shin, cocked-back grasshopper posture) ── -->
  <!-- Left hind leg -->
  <g stroke="#1B5E20" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Thigh: angled up-back from mid-body -->
    <line x1="52" y1="78" x2="22" y2="55" stroke-width="6"/>
    <!-- Shin: kicks down-forward from knee -->
    <line x1="22" y1="55" x2="38" y2="92" stroke-width="4.5"/>
  </g>

  <!-- Right hind leg (slightly offset for depth) -->
  <g stroke="#2E7D32" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="58" y1="75" x2="30" y2="52" stroke-width="5"/>
    <line x1="30" y1="52" x2="46" y2="88" stroke-width="3.5"/>
  </g>

  <!-- ── Mid legs (two simple strokes) ── -->
  <line x1="68" y1="76" x2="50" y2="98" stroke="#388E3C" stroke-width="3" stroke-linecap="round"/>
  <line x1="74" y1="73" x2="58" y2="94" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ── Front legs ── -->
  <line x1="88" y1="65" x2="76" y2="88" stroke="#388E3C" stroke-width="3" stroke-linecap="round"/>
  <line x1="92" y1="62" x2="82" y2="84" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ── Wing panels (folded flat over abdomen) ── -->
  <!-- Outer wing -->
  <ellipse cx="64" cy="70" rx="18" ry="9" fill="#A5D6A7" opacity="0.55"
           transform="rotate(-22 64 70)"/>
  <!-- Inner wing -->
  <ellipse cx="66" cy="69" rx="13" ry="6" fill="#C8E6C9" opacity="0.45"
           transform="rotate(-22 66 69)"/>

  <!-- ── Abdomen (tapered ellipse, pointing lower-left) ── -->
  <ellipse cx="60" cy="74" rx="28" ry="11" fill="url(#bodyGrad)"
           transform="rotate(-22 60 74)"/>

  <!-- Abdomen segmentation lines -->
  <g stroke="#2E7D32" stroke-width="1" opacity="0.5" stroke-linecap="round">
    <line x1="51" y1="67" x2="46" y2="79" transform="rotate(-22 48 73)"/>
    <line x1="61" y1="65" x2="56" y2="77" transform="rotate(-22 58 71)"/>
    <line x1="71" y1="63" x2="66" y2="75" transform="rotate(-22 68 69)"/>
  </g>

  <!-- ── Thorax (bridge between abdomen and head) ── -->
  <ellipse cx="82" cy="61" rx="13" ry="9" fill="#43A047"
           transform="rotate(-22 82 61)"/>

  <!-- ── Head ── -->
  <ellipse cx="97" cy="50" rx="10" ry="9" fill="url(#headGrad)"
           transform="rotate(-10 97 50)"/>

  <!-- Eye -->
  <circle cx="101" cy="46" r="3.5" fill="#1B5E20"/>
  <circle cx="102" cy="45" r="1.2" fill="#E8F5E9" opacity="0.8"/>

  <!-- ── Antenna (two thin strokes from head tip) ── -->
  <line x1="104" y1="44" x2="118" y2="28" stroke="#388E3C" stroke-width="2" stroke-linecap="round"/>
  <line x1="103" y1="43" x2="114" y2="24" stroke="#388E3C" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Antenna tips -->
  <circle cx="118" cy="28" r="2" fill="#4CAF50"/>
  <circle cx="114" cy="24" r="1.5" fill="#4CAF50" opacity="0.7"/>

  <!-- ── Search/retrieval motif: subtle arc suggesting a lens ──
       A quarter-arc in the lower-left negative space, very understated -->
  <path d="M 12 100 A 28 28 0 0 1 40 72" fill="none"
        stroke="#4CAF50" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
</svg>
