[package]
name = "grasshopper"
version = "1.0.0"
edition = "2024"
description = "Persistent hybrid search for code and memory. The agent-native grep."
license = "MIT"
repository = "https://github.com/MylesMCook/grasshopper"
homepage = "https://github.com/MylesMCook/grasshopper"
readme = "README.md"
authors = ["Myles Cook <mylesmcook@gmail.com>"]
keywords = ["search", "code-intelligence", "mcp", "retrieval", "embeddings"]
categories = ["command-line-utilities", "development-tools", "text-processing"]

[lints.clippy]
perf = { level = "deny", priority = -1 }
redundant_clone = { level = "deny" }

[dependencies]
# Database
rusqlite = { version = "0.32", features = ["bundled", "functions"] }

# Directory walking
ignore = "0.4"

# HTTP for model download
ureq = "3"

# Approximate nearest neighbor search
instant-distance = { version = "0.6", features = ["with-serde"] }
bincode = "1"

# MCP server
rmcp = { version = "0.16", features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = "0.7"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
http = "1"
schemars = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Cross-encoder reranking
fastembed = "5"

# Embedding model (transitive deps shared with embed.rs, pinned explicitly)
ort = "2.0.0-rc.11"
tokenizers = "0.22"
ndarray = "0.17"

# Cross-platform paths
dirs = "6"

# Utilities
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
